name: Deploy API

# main への push でイメージをビルド・GHCR へ push し、VPS へ SSH でロールする
# （技術選定書 §9.3・本番リリース計画書 §3.1 ステップ 10）。
#
# 事前にリポジトリの Secrets に以下を設定すること（ここから先は「ユーザー側でしかできない」作業）:
#   VPS_HOST, VPS_USER, VPS_SSH_KEY — デプロイ先 VPS への SSH 接続情報
#   （GHCR への push は GITHUB_TOKEN で認証できるので追加設定は不要）
on:
  push:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'packages/core/**'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          # GHCR のイメージ名は小文字必須。github.repository は大文字を含みうるので変換する。
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo}-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "image_latest=ghcr.io/${repo}-api:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.image_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/diggr/infra
            if grep -q '^API_IMAGE=' .env; then
              sed -i "s#^API_IMAGE=.*#API_IMAGE=${{ needs.build-and-push.outputs.image }}#" .env
            else
              echo "API_IMAGE=${{ needs.build-and-push.outputs.image }}" >> .env
            fi
            docker compose pull api
            docker compose up -d api
            sleep 5
            curl -f http://localhost:8080/health

      # ロールバック手順（本番リリース計画書 §7.2）: 直前のタグへ .env の API_IMAGE を戻して
      # 同じ script を再実行するだけ。ここでは自動化せず、手順を Runbook に残す。
